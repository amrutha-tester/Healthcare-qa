[pytest]
pythonpath=.

# Directory where pytest looks for test files
testpaths = tests

# CLI arguments
addopts =

    --browser=chromium
    # --browser=firefox
    # --browser=webkit
    --headed
    -v
    -s
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure


markers =
    smoke: Quick sanity checks for core functionality
    regression: Comprehensive regression test suite
    rbac: Role-based access control permission tests
    e2e: End-to-end clinical  workflow
    workflow: Workflow-level tests (e.g., patient check-in/check-out)